[package]
name = "enhancedextract-ui"
version = "0.1.2"
description = "EnhancedExtract desktop UI (Tauri). Drives the Python engine through its JSON CLI."
license = "MIT"
edition = "2021"

[lib]
name = "enhancedextract_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
